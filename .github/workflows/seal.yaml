name: Seal app env

# For apps on stock images (no build): seals the <APP>_ENV repo secret
# into infra/k8s/apps/<app>.yaml as encryptedData and pushes; Argo applies it.
# On push: seals every app file with envSecret but no encryptedData whose
# <APP>_ENV secret exists. Manual run: (re)seals one app, e.g. after editing its secret.
on:
  push:
    branches: [main]
    paths: ["infra/k8s/apps/*.yaml", ".github/workflows/seal.yaml"]
  workflow_dispatch:
    inputs:
      app:
        description: App name (file in infra/k8s/apps, also its namespace)
        required: true

concurrency: nyehrver-deploy

jobs:
  seal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.INFRA_TOKEN || github.token }}

      - name: Install kubeseal
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -o kubeseal.tar.gz https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.41.2/kubeseal-0.41.2-linux-amd64.tar.gz
          echo '666b5db6788ad1dedb56e2d97064e1cc3779aa77bbd6f4b56b62beeb1941ed79  kubeseal.tar.gz' | sha256sum -c -
          tar -xzf kubeseal.tar.gz kubeseal

      - name: Seal and push
        env:
          APP: ${{ inputs.app }}
          CERT: ${{ secrets.SEALED_SECRETS_CERT }}
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "${CERT:?Set the SEALED_SECRETS_CERT repo secret}" > "$dir/cert.pem"
          if [ -n "$APP" ]; then
            apps=$APP
          else
            # Unsealed apps only, so the bot's own commit doesn't reseal in a loop.
            apps=$(grep -L '^encryptedData:' $(grep -l '^envSecret:' infra/k8s/apps/*.yaml) | xargs -rn1 basename | sed 's/\.yaml$//')
          fi
          sealed=
          for app in $apps; do
            FILE="infra/k8s/apps/$app.yaml"
            test -f "$FILE" || { echo "no $FILE"; exit 1; }
            name="$(echo "$app" | tr 'a-z-' 'A-Z_')_ENV"
            jq -r --arg n "$name" '.[$n] // empty' <<< "$SECRETS" > "$dir/env"
            if [ ! -s "$dir/env" ]; then
              echo "::warning::skip $app: set the $name repo secret"
              [ -n "$APP" ] && exit 1 || continue
            fi
            data=$(kubectl create secret generic "$app-env" -n "$app" --from-env-file="$dir/env" --dry-run=client -o json |
              "$RUNNER_TEMP/kubeseal" --cert "$dir/cert.pem" --format json | jq -ce .spec.encryptedData)
            sed -i '/^encryptedData:/d' "$FILE"
            printf 'encryptedData: %s\n' "$data" >> "$FILE"
            sealed="$sealed $app"
          done
          [ -n "$sealed" ] || { echo "nothing to seal"; exit 0; }
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add infra/k8s/apps
          git commit -m "seal($(echo $sealed | tr ' ' ',')): env"
          git pull --rebase && git push
