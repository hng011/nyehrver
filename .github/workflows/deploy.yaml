name: Deploy app

on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      port:
        type: number
        default: 8000
      namespace:
        type: string
        default: ""
      env_secret:
        type: string
        default: ""
      memory_limit:
        type: string
        default: ""
      replicas:
        type: number
        default: 1
    secrets:
      INFRA_TOKEN:
        required: true

concurrency: nyehrver-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.name }}
          TAG=${GITHUB_SHA::7}
          docker build --platform linux/amd64 -t $IMAGE:$TAG .
          docker push $IMAGE:$TAG
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          repository: hng011/nyehrver
          token: ${{ secrets.INFRA_TOKEN }}
          path: nyehrver

      - name: Update values and push
        env:
          ENV_SECRET: ${{ inputs.env_secret }}
          MEMORY_LIMIT: ${{ inputs.memory_limit }}
        working-directory: nyehrver
        run: |
          FILE=infra/k8s/apps/${{ inputs.name }}.yaml
          cat > $FILE <<EOF
          image:
            repository: $IMAGE
            tag: "$TAG"
          port: ${{ inputs.port }}
          EOF
          if [ -n "${{ inputs.namespace }}" ]; then
            echo "namespace: ${{ inputs.namespace }}" >> $FILE
          fi
          if [ "${{ inputs.replicas }}" -gt 0 ]; then
            echo "replicas: ${{ inputs.replicas }}" >> $FILE
          fi
          if [ -n "$ENV_SECRET" ]; then echo "envSecret: $ENV_SECRET" >> "$FILE"; fi
          if [ -n "$MEMORY_LIMIT" ]; then printf 'resources:\n  limits:\n    memory: %s\n' "$MEMORY_LIMIT" >> "$FILE"; fi
          cat $FILE
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -m "deploy(${{ inputs.name }}): $TAG" || exit 0
          git pull --rebase && git push