name: Deploy app

on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      port:
        type: number
        default: 8000
      namespace:
        type: string
        default: ""
      env_secret:
        type: string
        default: ""
      seal_env:
        type: boolean
        default: false
      sealing_cert:
        type: string
        default: ""
      memory_limit:
        type: string
        default: ""
      replicas:
        type: number
        default: 1
      revision_history_limit:
        type: number
        default: 0
      persistence_size:
        type: string
        default: ""
      tcp_probe:
        type: boolean
        default: false
    secrets:
      SEALED_SECRETS_CERT:
        required: false
      ADMIN_USER:
        required: false
      ADMIN_PASS:
        required: false
      OPENAI_BASE_URL:
        required: false
      OPENAI_API_KEY:
        required: false
      OPENAI_MODEL:
        required: false
      ALLOW_DM:
        required: false
      INFRA_TOKEN:
        required: true

concurrency: nyehrver-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.name }}
          TAG=${GITHUB_SHA::7}
          docker build --platform linux/amd64 -t $IMAGE:$TAG .
          docker push $IMAGE:$TAG
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          repository: hng011/nyehrver
          token: ${{ secrets.INFRA_TOKEN }}
          path: nyehrver

      - name: Install kubeseal
        if: inputs.seal_env
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -o kubeseal.tar.gz https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.41.2/kubeseal-0.41.2-linux-amd64.tar.gz
          echo '666b5db6788ad1dedb56e2d97064e1cc3779aa77bbd6f4b56b62beeb1941ed79  kubeseal.tar.gz' | sha256sum -c -
          tar -xzf kubeseal.tar.gz kubeseal

      - name: Encrypt runtime settings
        if: inputs.seal_env
        env:
          CERT: ${{ secrets.SEALED_SECRETS_CERT || inputs.sealing_cert }}
          SECRET_NAME: ${{ inputs.env_secret }}
          NAMESPACE: ${{ inputs.namespace }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          ALLOW_DM: ${{ secrets.ALLOW_DM }}
        run: |
          set -euo pipefail
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "${CERT:?Set SEALED_SECRETS_CERT to the controller public certificate}" > "$dir/cert.pem"
          args=()
          for key in ADMIN_USER ADMIN_PASS OPENAI_BASE_URL OPENAI_API_KEY OPENAI_MODEL ALLOW_DM; do
            if [[ "$key" == ALLOW_DM && -z "${!key}" ]]; then continue; fi
            [[ -n "${!key}" ]] || { echo "Missing $key"; exit 1; }
            printf '%s' "${!key}" > "$dir/$key"
            args+=("--from-file=$key=$dir/$key")
          done
          kubectl create secret generic "$SECRET_NAME" -n "$NAMESPACE" "${args[@]}" --dry-run=client -o json |
            "$RUNNER_TEMP/kubeseal" --cert "$dir/cert.pem" --format json |
            jq -e '{encryptedData: .spec.encryptedData}' > "$RUNNER_TEMP/encrypted-values.json"

      - name: Update values and push
        env:
          ENV_SECRET: ${{ inputs.env_secret }}
          MEMORY_LIMIT: ${{ inputs.memory_limit }}
          PERSISTENCE_SIZE: ${{ inputs.persistence_size }}
          TCP_PROBE: ${{ inputs.tcp_probe }}
        working-directory: nyehrver
        run: |
          FILE=infra/k8s/apps/${{ inputs.name }}.yaml
          cat > $FILE <<EOF
          image:
            repository: $IMAGE
            tag: "$TAG"
          port: ${{ inputs.port }}
          EOF
          if [ -n "${{ inputs.namespace }}" ]; then
            echo "namespace: ${{ inputs.namespace }}" >> $FILE
          fi
          if [ "${{ inputs.replicas }}" -gt 0 ]; then
            echo "replicas: ${{ inputs.replicas }}" >> $FILE
          fi
          if [ "${{ inputs.revision_history_limit }}" -gt 0 ]; then
            echo "revisionHistoryLimit: ${{ inputs.revision_history_limit }}" >> $FILE
          fi
          if [ -n "$ENV_SECRET" ]; then echo "envSecret: $ENV_SECRET" >> "$FILE"; fi
          if [ -n "$PERSISTENCE_SIZE" ]; then printf 'persistence:\n  enabled: true\n  size: %s\n' "$PERSISTENCE_SIZE" >> "$FILE"; fi
          if [ "$TCP_PROBE" = true ]; then echo 'healthPath: ""' >> "$FILE"; fi
          if [ -n "$MEMORY_LIMIT" ]; then printf 'resources:\n  limits:\n    memory: %s\n' "$MEMORY_LIMIT" >> "$FILE"; fi
          if [ -f "$RUNNER_TEMP/encrypted-values.json" ]; then
            printf 'encryptedData: %s\n' "$(jq -c .encryptedData "$RUNNER_TEMP/encrypted-values.json")" >> "$FILE"
          fi
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -m "deploy(${{ inputs.name }}): $TAG" || exit 0
          git pull --rebase && git push