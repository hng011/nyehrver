name: Deploy app

on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      port:
        type: number
        default: 8000
    secrets:
      INFRA_TOKEN:
        required: true

concurrency: nyehrver-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.name }}
          TAG=${GITHUB_SHA::7}
          docker build --platform linux/amd64 -t $IMAGE:$TAG .
          docker push $IMAGE:$TAG
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          repository: hng011/nyehrver
          token: ${{ secrets.INFRA_TOKEN }}
          path: nyehrver

      - name: Update values and push
        working-directory: nyehrver
        run: |
          cat > infra/k8s/apps/${{ inputs.name }}.yaml <<EOF
          image:
            repository: $IMAGE
            tag: "$TAG"
          port: ${{ inputs.port }}
          EOF
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -m "deploy(${{ inputs.name }}): $TAG" || exit 0
          git pull --rebase && git push