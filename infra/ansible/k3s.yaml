- name: Install k3s and the platform
  hosts: vps
  become: true

  vars:
    k3s_version: v1.37.2+k3s1
    helm_version: v4.3.1
    cert_manager_version: v1.21.3
    argocd_chart_version: 10.3.0
    domain: "{{ lookup('env', 'DOMAIN') }}"
    acme_email: "{{ lookup('env', 'ACME_EMAIL') }}"
    argocd_host: "argocd.{{ domain }}"
    cert_issuer: letsencrypt-staging   # switch to letsencrypt-prod in Step 12
    pod_cidr: 10.42.0.0/16
    service_cidr: 10.43.0.0/16
    admin_user: "{{ ansible_user }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml

  pre_tasks:
    - name: DOMAIN and ACME_EMAIL are set
      ansible.builtin.assert:
        that:
          - domain | length > 0
          - acme_email is search('@')
        fail_msg: "Set DOMAIN and ACME_EMAIL in .env and run through make"

    - name: Root's Ansible temp folder exists
      ansible.builtin.raw: install -d -m 0700 /root/.ansible/tmp
      changed_when: false

  tasks:
    # Firewall and k3s
    - name: Allow pod and service traffic
      community.general.ufw:
        rule: allow
        from_ip: "{{ item }}"
      loop: ["{{ pod_cidr }}", "{{ service_cidr }}"]

    - name: k3s config folder
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: k3s config
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0644"
        content: |
          write-kubeconfig-mode: "0600"
          kubelet-arg:
            - "system-reserved=cpu=200m,memory=300Mi"
            - "kube-reserved=cpu=200m,memory=300Mi"
      notify: Restart k3s

    - name: Installed k3s version
      ansible.builtin.command: k3s --version
      register: k3s_installed
      changed_when: false
      failed_when: false

    - name: Install k3s
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} sh -s - server
      args:
        executable: /bin/bash
      when: k3s_version not in (k3s_installed.stdout | default(''))

    - name: Apply pending restarts
      ansible.builtin.meta: flush_handlers

    - name: Wait for the node to be Ready
      ansible.builtin.command: k3s kubectl get nodes --no-headers
      register: nodes
      until: "' Ready' in nodes.stdout"
      retries: 30
      delay: 5
      changed_when: false

    # kubectl for the admin user
    - name: ~/.kube exists
      ansible.builtin.file:
        path: "/home/{{ admin_user }}/.kube"
        state: directory
        owner: "{{ admin_user }}"
        mode: "0700"

    - name: Kubeconfig for the admin user
      ansible.builtin.copy:
        src: "{{ kubeconfig }}"
        remote_src: true
        dest: "/home/{{ admin_user }}/.kube/config"
        owner: "{{ admin_user }}"
        mode: "0600"

    - name: KUBECONFIG in .bashrc
      ansible.builtin.lineinfile:
        path: "/home/{{ admin_user }}/.bashrc"
        line: "export KUBECONFIG=$HOME/.kube/config"

    # Helm
    - name: Installed Helm version
      ansible.builtin.command: helm version --short
      register: helm_installed
      changed_when: false
      failed_when: false

    - name: Install Helm
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4 | DESIRED_VERSION={{ helm_version }} bash
      args:
        executable: /bin/bash
      when: helm_version not in (helm_installed.stdout | default(''))

    # Platform
    - name: Helm repos
      ansible.builtin.command: "helm repo add {{ item.name }} {{ item.url }} --force-update"
      loop:
        - { name: jetstack, url: https://charts.jetstack.io }
        - { name: argo, url: https://argoproj.github.io/argo-helm }
      environment: { KUBECONFIG: "{{ kubeconfig }}" }
      changed_when: false

    - name: cert-manager
      ansible.builtin.command: >
        helm upgrade --install cert-manager jetstack/cert-manager
        --namespace cert-manager --create-namespace
        --version {{ cert_manager_version }}
        --set crds.enabled=true
        --wait --timeout 10m
      environment: { KUBECONFIG: "{{ kubeconfig }}" }

    - name: Render the ClusterIssuers
      ansible.builtin.template:
        src: templates/cluster-issuers.yaml.j2
        dest: /root/cluster-issuers.yaml
        mode: "0600"

    - name: Apply the ClusterIssuers
      ansible.builtin.command: k3s kubectl apply -f /root/cluster-issuers.yaml
      register: issuers
      changed_when: "'configured' in issuers.stdout or 'created' in issuers.stdout"

    - name: Argo CD
      ansible.builtin.command: >
        helm upgrade --install argocd argo/argo-cd
        --namespace argocd --create-namespace
        --version {{ argocd_chart_version }}
        --set global.domain={{ argocd_host }}
        --set configs.params.server\.insecure=true
        --set server.ingress.enabled=true
        --set server.ingress.ingressClassName=traefik
        --set server.ingress.tls=true
        --set server.ingress.annotations.cert-manager\.io/cluster-issuer={{ cert_issuer }}
        --wait --timeout 10m
      environment: { KUBECONFIG: "{{ kubeconfig }}" }

    # GitOps entry point
    - name: Copy the ApplicationSet
      ansible.builtin.copy:
        src: ../k8s/appset.yaml
        dest: /root/argocd-appset.yaml
        mode: "0600"

    - name: Apply the ApplicationSet
      ansible.builtin.command: k3s kubectl apply -f /root/argocd-appset.yaml
      register: appset
      changed_when: "'configured' in appset.stdout or 'created' in appset.stdout"

  handlers:
    - name: Restart k3s
      ansible.builtin.systemd:
        name: k3s
        state: restarted