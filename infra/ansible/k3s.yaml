- name: Prepare a single-node k3s server
  hosts: k3s
  become: true
  vars:
    k3s_version: v1.37.2+k3s1
    helm_version: v4.3.1
    cert_manager_version: v1.21.3     # bump to v1.22.x once released (supports k8s 1.37)
    argocd_chart_version: 10.3.0
    pod_cidr: 10.42.0.0/16             # never change on an existing cluster
    service_cidr: 10.43.0.0/16         # never change on an existing cluster
    admin_user: "{{ ansible_user }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml

  pre_tasks:
    - name: Prepare Ansible's temp folder for root
      ansible.builtin.raw: install -d -m 0700 /root/.ansible/tmp
      changed_when: false

  tasks:
    # ---------- Firewall for cluster traffic ----------
    - name: Allow pod and service networks through ufw
      community.general.ufw:
        rule: allow
        from_ip: "{{ item }}"
      loop:
        - "{{ pod_cidr }}"
        - "{{ service_cidr }}"

    # ---------- k3s ----------
    - name: Create the k3s config folder
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Write the k3s config (read at every start)
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0644"
        content: |
          cluster-cidr: {{ pod_cidr }}
          service-cidr: {{ service_cidr }}
          write-kubeconfig-mode: "0600"
          kubelet-arg:
            - "system-reserved=cpu=200m,memory=500Mi"
            - "kube-reserved=cpu=200m,memory=300Mi"
      notify: Restart k3s

    - name: Check which k3s version is installed
      ansible.builtin.command: k3s --version
      register: k3s_installed
      changed_when: false
      failed_when: false

    - name: Install k3s (only if missing or a different version)
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} sh -s - server
      args:
        executable: /bin/bash
      when: k3s_version not in (k3s_installed.stdout | default(''))

    - name: Apply a changed k3s config now (before waiting)
      ansible.builtin.meta: flush_handlers

    - name: Wait until the node is Ready
      ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=10s
      register: node_ready
      until: node_ready.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    # ---------- kubectl for the admin user ----------
    - name: Create ~/.kube for the admin user
      ansible.builtin.file:
        path: "/home/{{ admin_user }}/.kube"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0700"

    - name: Give the admin user kubectl access
      ansible.builtin.copy:
        src: "{{ kubeconfig }}"
        dest: "/home/{{ admin_user }}/.kube/config"
        remote_src: true
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0600"

    - name: Make kubectl use the admin user's kubeconfig
      ansible.builtin.lineinfile:
        path: "/home/{{ admin_user }}/.bashrc"
        line: "export KUBECONFIG=$HOME/.kube/config"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"

    # ---------- Helm ----------
    - name: Check which Helm version is installed
      ansible.builtin.command: helm version --short
      register: helm_installed
      changed_when: false
      failed_when: false

    - name: Install Helm (only if missing or a different version)
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4 | DESIRED_VERSION={{ helm_version }} bash
      args:
        executable: /bin/bash
      when: helm_version not in (helm_installed.stdout | default(''))

    # ---------- Platform ----------
    - name: Add chart repositories
      ansible.builtin.command: "helm repo add {{ item.name }} {{ item.url }} --force-update"
      loop:
        - { name: jetstack, url: https://charts.jetstack.io }
        - { name: argo, url: https://argoproj.github.io/argo-helm }
      environment: { KUBECONFIG: "{{ kubeconfig }}" }
      changed_when: false

    - name: Install or upgrade cert-manager
      ansible.builtin.command: >
        helm upgrade --install cert-manager jetstack/cert-manager
        --namespace cert-manager --create-namespace
        --version {{ cert_manager_version }}
        --set crds.enabled=true
        --wait --timeout 10m
      environment: { KUBECONFIG: "{{ kubeconfig }}" }
      register: cm
      changed_when: "'REVISION: 1' in cm.stdout"

    - name: Install or upgrade Argo CD
      ansible.builtin.command: >
        helm upgrade --install argocd argo/argo-cd
        --namespace argocd --create-namespace
        --version {{ argocd_chart_version }}
        --wait --timeout 10m
      environment: { KUBECONFIG: "{{ kubeconfig }}" }
      register: argo
      changed_when: "'REVISION: 1' in argo.stdout"

  handlers:
    - name: Restart k3s
      ansible.builtin.systemd:
        name: k3s
        state: restarted