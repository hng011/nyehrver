apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  {{- with .Values.clusterIP }}
  # Fixed IP for host-level forwarders (e.g. Tailscale) that can't use cluster DNS.
  clusterIP: {{ . }}
  {{- end }}
  selector: { app: {{ .Release.Name }} }
  ports:
    - port: {{ .Values.servicePort }}
      targetPort: {{ .Values.port }}