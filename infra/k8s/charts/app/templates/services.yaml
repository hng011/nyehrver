apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  {{- with .Values.serviceType }}
  # LoadBalancer = k3s servicelb publishes servicePort on the node's public IP.
  type: {{ . }}
  {{- end }}
  {{- with .Values.clusterIP }}
  # Immutable once set; kept so existing Services keep syncing.
  clusterIP: {{ . }}
  {{- end }}
  selector: { app: {{ .Release.Name }} }
  ports:
    - port: {{ .Values.servicePort }}
      targetPort: {{ .Values.port }}