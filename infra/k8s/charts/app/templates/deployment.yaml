apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  # Old ReplicaSets kept for rollback (Kubernetes default is 10).
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- if .Values.persistence.enabled }}
  # The volume is ReadWriteOnce and holds a live session; two pods must never overlap.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels: { app: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app: {{ .Release.Name }} }
    spec:
      {{- if .Values.persistence.enabled }}
      securityContext:
        fsGroup: 1000
      {{- end }}
      {{- if or .Values.persistence.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          {{- with .Values.args }}
          args: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.port }}
          {{- with .Values.envSecret }}
          envFrom:
            - secretRef:
                name: {{ . | quote }}
          {{- end }}
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if or .Values.persistence.enabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- /* Empty healthPath = TCP probe, for apps whose every route needs auth. */}}
          readinessProbe:
            {{- if .Values.healthPath }}
            httpGet: { path: {{ .Values.healthPath }}, port: {{ .Values.port }} }
            {{- else }}
            tcpSocket: { port: {{ .Values.port }} }
            {{- end }}
            initialDelaySeconds: 3
          livenessProbe:
            {{- if .Values.healthPath }}
            httpGet: { path: {{ .Values.healthPath }}, port: {{ .Values.port }} }
            {{- else }}
            tcpSocket: { port: {{ .Values.port }} }
            {{- end }}
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            {{- with .Values.runAsUser }}
            # For images whose default USER is root (e.g. postgres).
            runAsUser: {{ . }}
            {{- end }}