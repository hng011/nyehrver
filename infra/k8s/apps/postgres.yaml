image:
  repository: postgres
  tag: "17.6-alpine"
port: 5432
servicePort: 5432
# Public on <VPS_IP>:5432, open to any IP; pg_hba below rejects non-TLS.
serviceType: LoadBalancer
# Set by the first deploy; clusterIP is immutable, so keep it.
clusterIP: 10.43.54.32
replicas: 1
# In-cluster apps: postgres.postgres.svc.cluster.local:5432
ingress:
  enabled: false
# Public name (resolves via the *.kaktus.foo wildcard; Postgres isn't routed by name, so this is the name to hand out).
host: mypg17.kaktus.foo
healthPath: ""
# Alpine image's postgres uid; its default USER is root.
runAsUser: 70
# Sealed from the POSTGRES_ENV repo secret by the "Seal app env" workflow.
envSecret: postgres-env
env:
  PGDATA: /var/lib/postgresql/data/pgdata
persistence:
  enabled: true
  size: 10Gi
  mountPath: /var/lib/postgresql/data
resources:
  limits:
    memory: 256Mi
args:
  - -c
  - ssl=on
  - -c
  - ssl_cert_file=/tls/tls.crt
  - -c
  - ssl_key_file=/tls/tls.key
  - -c
  - hba_file=/etc/postgres-hba/pg_hba.conf
extraVolumes:
  - name: tls
    secret:
      secretName: postgres-tls
      # Postgres accepts a root-owned key only at 0640 or stricter.
      defaultMode: 0640
  - name: hba
    configMap:
      name: postgres-hba
extraVolumeMounts:
  - { name: tls, mountPath: /tls, readOnly: true }
  - { name: hba, mountPath: /etc/postgres-hba, readOnly: true }
extraManifests:
  - apiVersion: v1
    kind: ConfigMap
    metadata: { name: postgres-hba }
    data:
      pg_hba.conf: |
        # Unix socket: the image's init scripts and kubectl exec psql.
        local     all  all            trust
        hostssl   all  all  0.0.0.0/0  scram-sha-256
        hostssl   all  all  ::/0       scram-sha-256
        hostnossl all  all  0.0.0.0/0  reject
        hostnossl all  all  ::/0       reject
  # shortcut: self-signed cert, clients use sslmode=require (encrypted, server not verified); move to a Let's Encrypt cert on a db.<domain> name for verify-full.
  - apiVersion: cert-manager.io/v1
    kind: Issuer
    metadata: { name: selfsigned }
    spec: { selfSigned: {} }
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: { name: postgres-tls }
    spec:
      secretName: postgres-tls
      commonName: mypg17.kaktus.foo
      dnsNames: [mypg17.kaktus.foo]
      duration: 87600h
      issuerRef: { name: selfsigned, kind: Issuer }
encryptedData: {"POSTGRES_DB":"","POSTGRES_PASSWORD":"","POSTGRES_USER":""}
