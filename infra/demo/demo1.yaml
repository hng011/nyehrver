apiVersion: v1
kind: Namespace
metadata:
  name: demo1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: demo1
spec:
  replicas: 2
  selector:
    matchLabels: { app: whoami }
  template:
    metadata:
      labels: { app: whoami }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /health, port: 80 }
          livenessProbe:
            httpGet: { path: /health, port: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: demo1
spec:
  selector: { app: whoami }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: demo1
spec:
  rules:
    - host: demo1.nyehrver.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port: { number: 80 }